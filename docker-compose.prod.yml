name: fastapi-ecommerce-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-env: &common-env
  REDIS_HOST: ${REDIS_HOST:-redis}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
  REDIS_PORT: ${REDIS_PORT:-6379}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  MEDIA_ROOT: /home/fast/app/media
  # S3 media storage
  MEDIA_STORAGE: ${MEDIA_STORAGE:-s3}
  YC_S3_DEFAULT_ACL: ${YC_S3_DEFAULT_ACL:-public-read}

services:

  web:
    restart: unless-stopped
    # Берем Dockerfile из каталога app
    build:
      context: .
      dockerfile: app/Dockerfile.prod.yml
    # Запускаем миграции, инициализацию БД и сервер Gunicorn
    command: sh -c "alembic upgrade head && python -m app.init_db && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    volumes:
      - media_data:/home/fast/app/media
    env_file:
      - .env
    # Переменные ниже задают значения по умолчанию, которых нет в .env
    environment:
      <<: *common-env
      ENVIRONMENT: production
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging: *default-logging

  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    user: "0:0"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

  celery_worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: app/Dockerfile.prod.yml
    user: "0:0"
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - media_data:/home/fast/app/media
    env_file:
      - .env
    # Переменные ниже задают значения по умолчанию, которых нет в .env
    environment:
      <<: *common-env
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    logging: *default-logging

  db:
    restart: unless-stopped
    image: postgres:15.8
    user: "0:0"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce_user} -d ${POSTGRES_DB:-ecommerce_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging: *default-logging

  nginx:
    restart: unless-stopped
    build: nginx
    user: "0:0"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - media_data:/home/fast/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

  certbot:
    restart: unless-stopped
    image: certbot/certbot
    user: "0:0"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --non-interactive; sleep 12h & wait $${!}; done;'"
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  media_data:
