server {
    listen 80;
    server_name fokin.fun 91.122.55.13;

    # Allow Let's Encrypt HTTP-01 challenge over plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    # All traffic redirects to HTTPS, preserving methods
    location / {
        return 308 https://fokin.fun$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fokin.fun 91.122.55.13;

    ssl_certificate /etc/letsencrypt/live/fokin.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fokin.fun/privkey.pem;

    client_max_body_size 500M;
    client_body_buffer_size 1M;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HTTP/2 tuning — allow more concurrent streams per connection
    http2_max_concurrent_streams 128;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app web;
    # Fix for news POST without slash (SSL server)
    location = /news {
        return 307 https://fokin.fun/news/;
    }

    location /news/ {
        proxy_pass http://$upstream_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location ~ ^/(ws|chat/ws)/ {
        proxy_pass http://$upstream_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Security: Block common scanner paths early to save application resources
    location ~* /(wp-admin|wp-login|wp-json|wp-content|wp-includes|cgi-bin|owncloud|license\.txt|\.php|\.env) {
        return 404;
    }

    # Скрываем служебные файлы, VCS, бэкапы, логи и документацию API в production
    location ~* /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(log|bak|sql|db|sqlite|ini|pem|key|p12|jks|keystore)$ {
        return 404;
    }
    location ~* ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location / {
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_pass http://$upstream_app:8000;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Приватные файлы (вложения чатов, журнал) НЕ отдаются напрямую из nginx:
    # запрос идёт в приложение, которое проверяет подпись (?sig=) / права владельца.
    location ~* ^/media/((chat|journal)/|users/[^/]+/chats(/|$)) {
        proxy_pass http://$upstream_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Внутренняя локация для X-Accel-Redirect: приложение авторизует запрос,
    # nginx сам читает файл. Снаружи недоступна (internal).
    location /protected_media/ {
        internal;
        alias /home/fast/app/media/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location /media/ {
        alias /home/fast/app/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Accept-Ranges bytes;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        # Allow cross-origin for mobile app
        add_header Access-Control-Allow-Origin "*";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }
}