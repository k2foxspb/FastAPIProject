<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление в приложение...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth {
            background: var(--panel-color);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .spinner {
            border: 4px solid rgba(240, 160, 75, 0.15);
            border-left: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 { font-size: 24px; margin: 0 0 12px; }
        .auth p { color: var(--text-secondary); margin: 0 0 28px; }
        .auth .btn { width: 100%; box-sizing: border-box; }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <main class="auth">
        <div class="spinner" role="status" aria-label="Перенаправление"></div>
        <h1>Перенаправляем в приложение</h1>
        <p>Если приложение не открылось автоматически, нажмите кнопку ниже.</p>
        <a id="redirect-link" class="btn" href="#">Открыть приложение</a>
    </main>

    <script>
        const scheme = "fokinfun://login";
        const queryParams = window.location.search;
        const deepLink = scheme + queryParams;
        
        // Update the button link
        document.getElementById("redirect-link").href = deepLink;

        // Try to redirect automatically
        window.location.replace(deepLink);

        // Fallback for some browsers: if still here after a delay
        setTimeout(() => {
            window.location.href = deepLink;
        }, 1000);
    </script>
</body>
</html>
